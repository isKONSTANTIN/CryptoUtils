name: Github CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test with Gradle
        run: ./gradlew test
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CryptoUtils
          path: build/libs/*.jar

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-suffix: linux-x86_64
            pkg-arch: amd64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-arm64
            pkg-arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/native-build.Dockerfile
          target: export
          outputs: type=local,dest=out

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: CryptoUtils-native-${{ matrix.artifact-suffix }}
          path: out/cryptoutils

      - name: Read project version
        id: version
        run: echo "version=$(grep -oP "(?<=^version ')[^']+" build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Build .deb/.rpm packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/native-build.Dockerfile
          target: package-export
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            PKG_ARCH=${{ matrix.pkg-arch }}
          outputs: type=local,dest=out-pkg

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: CryptoUtils-deb-${{ matrix.artifact-suffix }}
          path: out-pkg/*.deb

      - name: Upload .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: CryptoUtils-rpm-${{ matrix.artifact-suffix }}
          path: out-pkg/*.rpm